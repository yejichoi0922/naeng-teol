        const PASTEL_COLORS = [
          { bg: "#e8f5e3", text: "#3a7a2e", border: "#b6dca8" },
          { bg: "#fff0e6", text: "#9a5000", border: "#f5c899" },
          { bg: "#f0e8f8", text: "#6a3d9a", border: "#c9a8e8" },
          { bg: "#e6f0ff", text: "#1a4da0", border: "#a8c4f0" },
          { bg: "#fff4e6", text: "#a05a00", border: "#f0c880" },
          { bg: "#ffe6ec", text: "#9a1a3d", border: "#f0a8bc" },
        ];

        function getTagColor(name) {
          let hash = 0;
          for (let c of name) hash = (hash * 31 + c.charCodeAt(0)) % PASTEL_COLORS.length;
          return PASTEL_COLORS[hash];
        }

        const COZY_MESSAGES = [
          "따뜻한 레시피를 조리 가이드에 적어내려가고 있어요...",
          "냉장고 재료로 최선의 요리를 찾고 있어요...",
          "맛있는 한 끼를 준비 중이에요. 잠시만요...",
        ];

        function App() {
          const [page, setPage] = useState("home"); 
          const [query, setQuery] = useState("");
          const [suggestions, setSuggestions] = useState([]);
          const [ingredients, setIngredients] = useState([]);
          const [freshness, setFreshness] = useState({}); 
          const [difficulty, setDifficulty] = useState("쉬움");
          const [category, setCategory] = useState("아무거나");
          const [loading, setLoading] = useState(false);
          const [loadingMsg, setLoadingMsg] = useState(0);
          const [recipe, setRecipe] = useState(null);
          const [checkedSteps, setCheckedSteps] = useState({});
          const [subModal, setSubModal] = useState(null); 
          const [subAnswer, setSubAnswer] = useState("");
          const [subLoading, setSubLoading] = useState(false);
          const inputRef = useRef(null);
          const loadingInterval = useRef(null);

          useEffect(() => {
            if (query.trim().length < 1) { setSuggestions([]); return; }
            const filtered = SAMPLE_INGREDIENTS.filter(i =>
              i.includes(query) && !ingredients.includes(i)
            ).slice(0, 6);
            setSuggestions(filtered);
          }, [query, ingredients]);

          useEffect(() => {
            if (loading) {
              loadingInterval.current = setInterval(() =>
                setLoadingMsg(m => (m + 1) % COZY_MESSAGES.length), 2200);
            } else {
              clearInterval(loadingInterval.current);
            }
            return () => clearInterval(loadingInterval.current);
          }, [loading]);

          function addIngredient(name) {
            if (!name.trim() || ingredients.includes(name)) return;
            setIngredients(p => [...p, name]);
            setFreshness(p => ({ ...p, [name]: "신선함" }));
            setQuery("");
            setSuggestions([]);
            setTimeout(() => inputRef.current?.focus(), 50);
          }

          function removeIngredient(name) {
            setIngredients(p => p.filter(i => i !== name));
            setFreshness(p => { const n = { ...p }; delete n[name]; return n; });
          }

          function toggleFreshness(name) {
            setFreshness(p => ({
              ...p,
              [name]: p[name] === "신선함" ? "곧 상함" : "신선함",
            }));
          }

          async function generateRecipe() {
            if (ingredients.length === 0) return;
            setLoading(true);
            setPage("result");
            setRecipe(null);
            setCheckedSteps({});

            const soonExpiring = ingredients.filter(i => freshness[i] === "곧 상함");
            const prompt = `당신은 친절한 요리 도우미입니다. 다음 재료로 만들 수 있는 레시피를 JSON 형식으로 생성해주세요.

보유 재료: ${ingredients.join(", ")}
${soonExpiring.length > 0 ? `곧 상하는 재료 (우선 사용): ${soonExpiring.join(", ")}` : ""}
난이도: ${difficulty}
카테고리: ${category}

응답은 반드시 아래 JSON 형식만 출력하세요. 설명이나 마크다운 없이 순수 JSON만:
{
  "name": "요리 이름",
  "difficulty": "쉬움",
  "time": "15분",
  "servings": "2인분",
  "description": "요리에 대한 따뜻한 한 줄 소개",
  "ingredients": [
    { "name": "재료명", "amount": "2개", "is_owned": true }
  ],
  "steps": [
    "단계 설명..."
  ],
  "tip": "요리 팁 한 줄"
}

is_owned는 사용자가 보유한 재료면 true, 없으면 false로 설정하세요.`;

            try {
              const res = await fetch("https://api.anthropic.com/v1/messages", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  model: "claude-sonnet-4-20250514",
                  max_tokens: 1000,
                  messages: [{ role: "user", content: prompt }],
                }),
              });
              const data = await res.json();
              const text = data.content.map(b => b.text || "").join("");
              const clean = text.replace(/```json|```/g, "").trim();
              const parsed = JSON.parse(clean);
              setRecipe(parsed);
            } catch (e) {
              setRecipe({
                name: "간단 달걀 볶음밥",
                difficulty: difficulty,
                time: "10분",
                servings: "1인분",
                description: "냉장고 재료로 뚝딱 만드는 따뜻한 한 끼예요.",
                ingredients: ingredients.map(i => ({ name: i, amount: "적당량", is_owned: true })),
                steps: [
                  "재료를 손질해 주세요.",
                  "팬에 기름을 두르고 재료를 볶아주세요.",
                  "간을 맞추고 그릇에 담아 맛있게 드세요.",
                ],
                tip: "취향에 따라 간장이나 소금으로 간을 조절해보세요.",
              });
            }
            setLoading(false);
          }

          async function askSubstitute(ingName) {
            setSubModal(ingName);
            setSubAnswer("");
            setSubLoading(true);
            const prompt = `요리 초보자에게 친절하게 설명해주세요. "${ingName}"을(를) 빼고 요리할 수 있는지, 혹은 대체할 수 있는 재료가 있는지 2-3문장으로 따뜻하고 친근하게 안내해주세요.`;
            try {
              const res = await fetch("https://api.anthropic.com/v1/messages", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  model: "claude-sonnet-4-20250514",
                  max_tokens: 200,
                  messages: [{ role: "user", content: prompt }],
                }),
              });
              const data = await res.json();
              setSubAnswer(data.content.map(b => b.text || "").join(""));
            } catch {
              setSubAnswer("잠시 후 다시 시도해주세요.");
            }
            setSubLoading(false);
          }
